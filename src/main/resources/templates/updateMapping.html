<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cocktail Mapping Update</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .cocktail-mapping { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; }
        .checkbox-group { display: flex; flex-wrap: wrap; }
        .checkbox-group div { margin-right: 15px; }
        hr { margin: 40px 0; }
    </style>
</head>
<body>
<h1>Cocktail Mapping Update</h1>

<!-- 기존 매핑 정보 출력 -->
<h2>현재 매핑 정보</h2>
<div th:each="cocktailMap : ${cocktails}" class="cocktail-mapping">
    <h3 th:text="${cocktailMap.cocktail.cocktailName}">Cocktail Name</h3>
    <p>ID: <span th:text="${cocktailMap.cocktail.id}">1</span></p>
    <p th:if="${cocktailMap.cocktail.introduce != null}">
        Description: <span th:text="${cocktailMap.cocktail.introduce}">Description here</span>
    </p>

    <h4>Ingredients</h4>
    <ul>
        <li th:each="ingredient : ${cocktailMap.ingredient}"
            th:text="${ingredient}">Ingredient</li>
    </ul>

    <h4>Tastes</h4>
    <ul>
        <li th:each="taste : ${cocktailMap.taste}"
            th:text="${taste}">Taste</li>
    </ul>

    <h4>Recommendations</h4>
    <ul>
        <li th:each="recommand : ${cocktailMap.recommand}"
            th:text="${recommand}">Recommendation</li>
    </ul>
</div>

<hr/>

<!-- 매핑 업데이트 폼 -->
<h2>매핑 업데이트</h2>
<form th:action="@{/admin/cocktail/mapping/update}" method="post">
    <!-- Optional: mappingIngredientId -->
    <div class="form-group">
        <label for="mappingIngredientId">Mapping Ingredient ID (옵션)</label>
        <input type="text" id="mappingIngredientId" name="mappingIngredientId" placeholder="수정할 매핑 ID (없으면 비워두세요)">
    </div>

    <!-- 칵테일 선택 (cocktailId) -->
    <div class="form-group">
        <label for="cocktailId">칵테일 선택</label>
        <select id="cocktailId" name="cocktailId" required>
            <option value="">선택하세요</option>
            <option th:each="cocktailMap : ${cocktails}"
                    th:value="${cocktailMap.cocktail.id}"
                    th:text="${cocktailMap.cocktail.cocktailName}">Cocktail Name</option>
        </select>
    </div>

    <!-- 재료 선택 (ingredientIds) -->
    <div class="form-group">
        <label>Ingredients (재료)</label>
        <div class="checkbox-group">
            <!-- 예시: 실제 목록은 동적으로 채워야 함 -->
            <div>
                <input type="checkbox" id="ingredient1" name="ingredientIds" value="1">
                <label for="ingredient1">재료 1</label>
            </div>
            <div>
                <input type="checkbox" id="ingredient2" name="ingredientIds" value="2">
                <label for="ingredient2">재료 2</label>
            </div>
            <div>
                <input type="checkbox" id="ingredient3" name="ingredientIds" value="3">
                <label for="ingredient3">재료 3</label>
            </div>
        </div>
    </div>

    <!-- 수량 및 단위 -->
    <div class="form-group">
        <label for="quantity">Quantity (수량)</label>
        <input type="number" step="0.01" id="quantity" name="quantity" required placeholder="예: 1.5">
    </div>
    <div class="form-group">
        <label for="unit">Unit (단위)</label>
        <input type="text" id="unit" name="unit" required placeholder="예: ml, oz">
    </div>

    <!-- 맛 카테고리 (tasteCategoryId) -->
    <div class="form-group">
        <label for="tasteCategoryId">Taste Category (맛 카테고리)</label>
        <select id="tasteCategoryId" name="tasteCategoryId" required>
            <option value="">선택하세요</option>
            <!-- 예시: 실제 값은 DB 데이터로 대체 -->
            <option value="1">달콤함</option>
            <option value="2">신맛</option>
            <option value="3">쓴맛</option>
        </select>
    </div>

    <!-- 맛 상세 (tasteDetailIds) -->
    <div class="form-group">
        <label>Taste Details (맛 상세)</label>
        <div class="checkbox-group">
            <div>
                <input type="checkbox" id="tasteDetail1" name="tasteDetailIds" value="1">
                <label for="tasteDetail1">맛 상세 1</label>
            </div>
            <div>
                <input type="checkbox" id="tasteDetail2" name="tasteDetailIds" value="2">
                <label for="tasteDetail2">맛 상세 2</label>
            </div>
            <div>
                <input type="checkbox" id="tasteDetail3" name="tasteDetailIds" value="3">
                <label for="tasteDetail3">맛 상세 3</label>
            </div>
        </div>
    </div>

    <!-- 분위기 (moodIds) -->
    <div class="form-group">
        <label>Moods (분위기)</label>
        <div class="checkbox-group">
            <div>
                <input type="checkbox" id="mood1" name="moodIds" value="1">
                <label for="mood1">분위기 1</label>
            </div>
            <div>
                <input type="checkbox" id="mood2" name="moodIds" value="2">
                <label for="mood2">분위기 2</label>
            </div>
        </div>
    </div>

    <!-- 지역 (locationIds) -->
    <div class="form-group">
        <label>Locations (지역)</label>
        <div class="checkbox-group">
            <div>
                <input type="checkbox" id="location1" name="locationIds" value="1">
                <label for="location1">지역 1</label>
            </div>
            <div>
                <input type="checkbox" id="location2" name="locationIds" value="2">
                <label for="location2">지역 2</label>
            </div>
        </div>
    </div>

    <!-- 계절 (seasonIds) -->
    <div class="form-group">
        <label>Seasons (계절)</label>
        <div class="checkbox-group">
            <div>
                <input type="checkbox" id="season1" name="seasonIds" value="1">
                <label for="season1">계절 1</label>
            </div>
            <div>
                <input type="checkbox" id="season2" name="seasonIds" value="2">
                <label for="season2">계절 2</label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <button type="submit">매핑 업데이트</button>
    </div>
</form>
</body>
</html>
