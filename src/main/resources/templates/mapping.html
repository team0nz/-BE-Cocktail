<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Cocktail Mapping</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .section {
            border: 1px solid #ccc;
            margin-bottom: 20px;
            padding: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        select, input[type="text"] {
            width: 300px;
            padding: 5px;
            margin-top: 5px;
        }
    </style>
    <script>
        $(document).ready(function(){
            // Taste: Taste Category 선택 시, 해당 카테고리의 Taste Detail만 보이도록 필터링
            $("#tasteCategorySelect").change(function(){
                var selectedCat = $(this).val();
                // 모든 Taste Detail 옵션 숨김 처리
                $("#tasteDetailSelect option").hide();
                // 기본 옵션은 항상 보이도록 함
                $("#tasteDetailSelect option.default").show();
                // 선택한 카테고리에 해당하는 Taste Detail 옵션만 보이기 (data-category 속성이 있어야 함)
                $("#tasteDetailSelect option[data-category='" + selectedCat + "']").show();
            });
        });
    </script>
</head>
<body>
<h1>Update Cocktail Mapping</h1>
<form th:action="@{/admin/cocktail/mapping/update}" method="post">
    <!-- Hidden Mapping IDs (optional; 값이 있으면 업데이트, 없으면 신규 생성) -->
    <input type="hidden" name="mappingIngredientId" value=""/>
    <input type="hidden" name="mappingTasteId" value=""/>
    <input type="hidden" name="mappingRecommendId" value=""/>

    <!-- Cocktail Section -->
    <div class="section">
        <h2>Cocktail</h2>
        <label for="cocktailSelect">Select Cocktail:</label>
        <select id="cocktailSelect" name="cocktailId" required>
            <option value="">-- Select Cocktail --</option>
            <option th:each="cocktailInfo : ${cocktails}"
                    th:value="${cocktailInfo.cocktail.id}"
                    th:text="${cocktailInfo.cocktail.cocktailName}">Cocktail Name</option>
        </select>
    </div>

    <!-- Ingredient Mapping Section -->
    <div class="section">
        <h2>Ingredients</h2>
        <label for="ingredientSelect">Select Ingredients:</label>
        <select id="ingredientSelect" name="ingredientIds" multiple size="5">
            <option value="">-- Select Ingredients --</option>
            <option th:each="ing : ${ingredients}"
                    th:value="${ing.id}"
                    th:text="${ing.material}">Ingredient</option>
        </select>
        <br/>
        <label for="quantityInput">Quantity:</label>
        <input type="text" id="quantityInput" name="quantity" placeholder="Enter quantity" required/>
        <br/>
        <label for="unitInput">Unit:</label>
        <input type="text" id="unitInput" name="unit" placeholder="Enter unit" required/>
    </div>

    <!-- Taste Mapping Section -->
    <div class="section">
        <h2>Taste</h2>
        <label for="tasteCategorySelect">Taste Category:</label>
        <select id="tasteCategorySelect" name="tasteCategoryId" required>
            <option value="">-- Select Taste Category --</option>
            <option th:each="tc : ${tasteCategories}"
                    th:value="${tc.id}"
                    th:text="${tc.tasteCategory}">Taste Category</option>
        </select>
        <br/>
        <label for="tasteDetailSelect">Taste Details:</label>
        <select id="tasteDetailSelect" name="tasteDetailIds" multiple size="5">
            <option value="" class="default">-- Select Taste Details --</option>
            <!-- 모든 Taste Detail을 출력하되, 각 옵션에 data-category 속성을 추가 -->
            <option th:each="td : ${tasteDetails}"
                    th:value="${td.id}"
                    th:text="${td.tasteDetail}"
                    th:attr="data-category=${td.tasteCategory.id}">Taste Detail</option>
        </select>
    </div>

    <!-- Recommend Mapping Section -->
    <div class="section">
        <h2>Recommend Mapping</h2>
        <label for="moodSelect">Select Moods:</label>
        <select id="moodSelect" name="moodIds" multiple size="5">
            <option value="">-- Select Moods --</option>
            <option th:each="m : ${moods}"
                    th:value="${m.id}"
                    th:text="${m.mood}">Mood</option>
        </select>
        <br/>
        <label for="situationSelect">Select Situations:</label>
        <select id="situationSelect" name="situationIds" multiple size="5">
            <option value="">-- Select Situations --</option>
            <option th:each="l : ${situations}"
                    th:value="${l.id}"
                    th:text="${l.situation}">Situation</option>
        </select>
        <br/>
        <label for="seasonSelect">Select Seasons:</label>
        <select id="seasonSelect" name="seasonIds" multiple size="5">
            <option value="">-- Select Seasons --</option>
            <option th:each="s : ${seasons}"
                    th:value="${s.id}"
                    th:text="${s.season}">Season</option>
        </select>
    </div>

    <div class="section">
        <button type="submit">Update Mapping</button>
    </div>
</form>
</body>
</html>
