<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cocktail Info Management</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .form-container {
          margin-bottom: 30px;
          border: 1px solid #ccc;
          padding: 10px;
        }
        .details {
          display: none;
          margin-top: 10px;
        }
    </style>
    <script>
        $(document).ready(function() {
          // Taste: Taste Category를 선택하면, 해당 카테고리의 Taste Detail 섹션만 보여준다.
          $("#tasteCategorySelect").change(function(){
              var selectedCatId = $(this).val();
              // 모든 Taste Detail 컨테이너 숨김
              $(".taste-detail-container").hide();
              // 선택한 카테고리의 Taste Detail 컨테이너 보이기
              $('.taste-detail-container[data-category-id="' + selectedCatId + '"]').show();
          });
        });
    </script>
</head>
<body>
<h1>Cocktail Info Management</h1>

<!-- Taste Section (Taste Category 및 Detail) -->
<div class="form-container">
    <h2>Taste</h2>
    <!-- Taste Category 선택 -->
    <label for="tasteCategorySelect">Taste Category:</label>
    <select id="tasteCategorySelect" name="tasteCategory">
        <option value="">-- Select Taste Category --</option>
        <!-- taste: Map&lt;TasteCategory, List&lt;TasteDetail&gt;&gt; -->
        <option th:each="tc : ${taste.keySet()}"
                th:value="${tc.id}"
                th:text="${tc.tasteCategory}">Category</option>
    </select>
    <br/><br/>

    <!-- Taste Detail 선택 영역: 각 Taste Category에 해당하는 Taste Details는 별도의 div로 감싼다 -->
    <div id="tasteDetailContainer">
        <div th:each="entry : ${taste}"
             class="taste-detail-container"
             th:attr="data-category-id=${entry.key.id}"
             style="display:none;">
            <label for="tasteDetailSelect_[[${entry.key.id}]]">Taste Detail for <span th:text="${entry.key.tasteCategory}">Category</span>:</label>
            <select id="tasteDetailSelect_[[${entry.key.id}]]" name="tasteDetail">
                <option value="">-- Select Taste Detail --</option>
                <option th:each="detail : ${entry.value}"
                        th:value="${detail.id}"
                        th:text="${detail.tasteDetail}">Detail</option>
            </select>
            <br/><br/>
            <!-- 수정 폼 (토글 방식) -->
            <form th:action="@{/admin/cocktail/taste/detail/update}" method="post">
                <input type="hidden" id="tasteDetailId_[[${entry.key.id}]]" name="id"/>
                <input type="hidden" id="tasteCategoryId_[[${entry.key.id}]]" name="tasteCategoryId" th:value="${entry.key.id}" />
                <input type="text" id="tasteDetailInput_[[${entry.key.id}]]" name="tasteDetailValue" placeholder="Taste Detail Value"/>
                <button type="submit">Update Taste Detail</button>
            </form>
        </div>
    </div>
    <br/>
    <!-- Taste Category 추가/수정 폼 -->
    <form th:action="@{/admin/cocktail/taste/category/update}" method="post">
        <input type="hidden" name="id" value=""/>
        <input type="text" name="tasteCategoryValue" placeholder="New/Update Taste Category"/>
        <button type="submit">Update Taste Category</button>
    </form>
</div>

<!-- Situation Section -->
<div class="form-container">
    <h2>Situation</h2>
    <label for="situationSelect">Situation List:</label>
    <select id="situationSelect" name="situation">
        <option value="">-- Select Situation --</option>
        <option th:each="loc : ${situations}" th:value="${loc.id}" th:text="${loc.situation}">Situation</option>
    </select>
    <form id="situationForm" th:action="@{/admin/cocktail/situation/update}" method="post">
        <input type="hidden" id="situationId" name="id"/>
        <input type="text" id="situationInput" name="situation" placeholder="Situation"/>
        <button type="submit">Update Situation</button>
    </form>
</div>

<!-- Mood Section -->
<div class="form-container">
    <h2>Mood</h2>
    <label for="moodSelect">Mood List:</label>
    <select id="moodSelect" name="mood">
        <option value="">-- Select Mood --</option>
        <option th:each="m : ${moods}" th:value="${m.id}" th:text="${m.mood}">Mood</option>
    </select>
    <form id="moodForm" th:action="@{/admin/cocktail/mood/update}" method="post">
        <input type="hidden" id="moodId" name="id"/>
        <input type="text" id="moodInput" name="mood" placeholder="Mood"/>
        <button type="submit">Update Mood</button>
    </form>
</div>

<!-- Season Section -->
<div class="form-container">
    <h2>Season</h2>
    <label for="seasonSelect">Season List:</label>
    <select id="seasonSelect" name="season">
        <option value="">-- Select Season --</option>
        <option th:each="s : ${seasons}" th:value="${s.id}" th:text="${s.season}">Season</option>
    </select>
    <form id="seasonForm" th:action="@{/admin/cocktail/season/update}" method="post">
        <input type="hidden" id="seasonId" name="id"/>
        <input type="text" id="seasonInput" name="season" placeholder="Season"/>
        <button type="submit">Update Season</button>
    </form>
</div>

<!-- Ingredient Section -->
<div class="form-container">
    <h2>Ingredient</h2>
    <label for="ingredientSelect">Ingredient List:</label>
    <select id="ingredientSelect" name="ingredient">
        <option value="">-- Select Ingredient --</option>
        <option th:each="ing : ${ingredients}" th:value="${ing.id}" th:text="${ing.material}">Ingredient</option>
    </select>
    <form id="ingredientForm" th:action="@{/admin/cocktail/ingredient/update}" method="post">
        <input type="hidden" id="ingredientId" name="id"/>
        <input type="text" id="ingredientInput" name="material" placeholder="Ingredient"/>
        <button type="submit">Update Ingredient</button>
    </form>
</div>

<!-- Cocktail Section -->
<div class="form-container">
    <h2>Cocktail</h2>
    <label for="cocktailSelect">Cocktail List:</label>
    <select id="cocktailSelect" name="cocktail">
        <option value="">-- Select Cocktail --</option>
        <option th:each="c : ${cocktails}" th:value="${c.id}" th:text="${c.cocktailName}">Cocktail</option>
    </select>
    <form id="cocktailForm" th:action="@{/admin/cocktail/update}" method="post">
        <input type="hidden" id="cocktailId" name="id"/>
        <input type="text" id="cocktailNameInput" name="cocktailName" placeholder="Cocktail Name"/>
        <input type="text" name="cocktailSize" placeholder="Cocktail Size"/>
        <input type="text" name="introduce" placeholder="Introduce"/>
        <input type="text" name="maxAlchol" placeholder="Max Alcohol"/>
        <input type="text" name="minAlchol" placeholder="Min Alcohol"/>
        <button type="submit">Update Cocktail</button>
    </form>
</div>

</body>
</html>
